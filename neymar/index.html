    <script>
      // If the app has not started after a few seconds, explain why instead of
      // leaving a blank page: either this is the source file opened from disk,
      // or the browser hit an error.
      (function () {
        var firstError = '';
        window.addEventListener('error', function (e) {
          if (!firstError) firstError = (e && e.message) || 'Unknown error';
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.hasChildNodes()) return;
          var hint = document.getElementById('boot-hint');
          var isSource = !/\/site\/(index\.html)?$/.test(location.pathname) && location.protocol === 'file:';
          hint.innerHTML = isSource
            ? '<strong>Ce fichier est le code source.</strong><p>Pour voir le site, ouvrez <code>site/index.html</code> dans ce dossier.</p><a href="site/index.html">Ouvrir le site</a>'
            : '<strong>Le site n’a pas pu démarrer dans ce navigateur.</strong><p>Essayez d’ouvrir ce fichier avec Google Chrome ou Safari.</p>' +
              (firstError ? '<p><code></code></p>' : '');
          if (firstError && hint.querySelector('code')) hint.querySelector('code').textContent = firstError;
          hint.className = 'is-visible';
        }, 4000);
      })();
